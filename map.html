<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map - Groupie Tracker</title>
    <link rel="stylesheet" href="map.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map {
            height: 600px;
            width: 100%;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <!-- En-tête avec barre de recherche -->
    <header class="header">
        <div class="header-stripes"></div>
        <div class="header-content">
            <img src="public/images/palmier.png" alt="Palm tree" class="palm-left">
            <!-- Bouton pour localisation -->
            <button class="location-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="currentColor"/>
                </svg>
            </button>
            <nav class="nav-left">
                <a href="index.html">home</a>
                <a href="artists.html">artistes</a>
                <a href="credits.html">crédits</a>
            </nav>
            <h1 class="logo">GROUPIE TRACKER</h1>
            <div class="header-right">
            </div>
            <img src="public/images/palmier.png" alt="Palm tree" class="palm-right">
        </div>
    </header>

    <!-- Contenu principal avec la carte -->
    <main class="main-content">
        <img src="public/images/palmier.png" alt="" class="palm-bg palm-bg-left">
        <img src="public/images/palmier.png" alt="" class="palm-bg palm-bg-right">
        
        <div class="map-container">
            <div class="map-card">
                <div class="map-wrapper">
                    <!-- Élément pour afficher la carte Leaflet -->
                    <div id="map"></div></div>
                </div>
                <div class="locations-info">
                    <h2>GROUPIE TRACKER</h2>
                    <p class="group-name">groupe</p>
                    <div class="locations-list">
                        <div class="location-item">ville pays</div>
                        <div class="location-item">ville pays</div>
                        <div class="location-item">ville pays</div>
                        <div class="location-item">ville pays</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Pied de page -->
    <footer class="footer">
        <div class="footer-stripes"></div>
        <div class="footer-content">
            <a href="https://github.com/gcouvri" target="_blank">gcouvri</a>
            <a href="https://github.com/vbosson" target="_blank">vbosson</a>
            <a href="https://github.com/kcamesel" target="_blank">kcamesel</a>
        </div>
    </footer>

    <!-- Scripts JavaScript pour la carte et le géocodage -->
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // Variables pour la carte et les marqueurs
        let map;
        let markers = [];
        let currentArtistId = null;

        // Format location name from API format (city-country) to readable format
        function formatLocationName(location) {
            // Replace underscores with spaces
            let formatted = location.replace(/_/g, ' ');
            // Split by hyphen and rejoin with proper formatting
            const parts = formatted.split('-');
            if (parts.length >= 2) {
                const city = parts.slice(0, -1).join('-').trim();
                const country = parts[parts.length - 1].trim();
                // Capitalize first letter of each word
                return city.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ') + ', ' +
                       country.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
            }
            return formatted;
        }

        // Initialiser la carte Leaflet
        function initMap() {
            const defaultLocation = [48.8566, 2.3522]; // Paris
            
            map = L.map('map').setView(defaultLocation, 3);
            
            // Ajouter la couche OpenStreetMap
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(map);
        }

        // Charger l'artiste à partir de l'URL
        async function loadArtistFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            const artistName = urlParams.get('artist');
            
            if (artistName) {
                try {
                    const response = await fetch('/api/artists');
                    const artists = await response.json();
                    
                    const artist = artists.find(a => a.name === decodeURIComponent(artistName));
                    if (artist) {
                        displayArtistLocations(artist.id);
                    } else {
                        console.warn('Artist not found:', artistName);
                    }
                } catch (error) {
                    console.error('Error loading artists:', error);
                }
            }
        }

        // Afficher les lieux de concert pour un artiste
        async function displayArtistLocations(artistId) {
            // Nettoyer les anciens marqueurs
            markers.forEach(marker => map.removeLayer(marker));
            markers = [];
            
            try {
                const response = await fetch(`/artist/${artistId}`);
                const data = await response.json();
                
                if (!data.Locations || data.Locations.length === 0) {
                    alert('Pas de lieux de concert trouvés pour cet artiste');
                    return;
                }
                
                // Mettre à jour le nom du groupe
                document.querySelector('.group-name').textContent = data.Artist.name;
                
                // Géocoder chaque lieu et ajouter un marqueur
                for (const location of data.Locations) {
                    try {
                        const coord = await geocodeLocation(location);
                        const displayName = formatLocationName(location);
                        
                        const marker = L.circleMarker(
                            [coord.latitude, coord.longitude],
                            {
                                radius: 8,
                                fillColor: '#ff6b6b',
                                color: '#fff',
                                weight: 2,
                                opacity: 1,
                                fillOpacity: 0.8
                            }
                        ).bindPopup(`<strong>${displayName}</strong>`).addTo(map);
                        
                        markers.push(marker);
                    } catch (error) {
                        console.error(`Error geocoding ${location}:`, error);
                    }
                }
                
                // Adapter la vue de la carte aux marqueurs
                if (markers.length > 0) {
                    const group = new L.featureGroup(markers);
                    map.fitBounds(group.getBounds());
                }
                
                // Afficher la liste des lieux
                displayLocationsList(data.Locations);
            } catch (error) {
                console.error('Error displaying artist locations:', error);
                alert('Erreur lors du chargement des lieux');
            }
        }

        // Géocoder une adresse
        async function geocodeLocation(address) {
            try {
                const response = await fetch(`/api/geocode?address=${encodeURIComponent(address)}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return await response.json();
            } catch (error) {
                console.error(`Geocoding error for ${address}:`, error);
                throw error;
            }
        }

        // Afficher la liste des lieux
        function displayLocationsList(locations) {
            const list = document.querySelector('.locations-list');
            list.innerHTML = '';
            locations.forEach(location => {
                const item = document.createElement('div');
                item.className = 'location-item';
                item.textContent = formatLocationName(location);
                list.appendChild(item);
            });
        }

        // Initialiser la page
        document.addEventListener('DOMContentLoaded', function() {
            initMap();
            loadArtistFromUrl();
        });
    </script>
</body>
</html>
